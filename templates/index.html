<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adhaan Prayer Times</title>
    <script src="/static/script.js" type="module"></script>
    <script src="/static/js/utils.js" type="module"></script>
    <script src="/static/js/fetchPrayerTimes.js" type="module"></script>
    <script src="/static/js/displayPrayerTimes.js" type="module"></script>
    <script src="/static/js/eventListeners.js" type="module"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">
    <div class="max-w-2xl mx-auto mt-10 p-6 bg-gray-800 shadow-lg rounded-lg">
        <!-- Title -->
        <h1 class="text-3xl font-bold text-white text-center mb-4">Adhaan Prayer Times</h1>

        <!-- Header Section -->
        <div class="flex justify-between items-center mb-4 text-sm text-gray-300">
            <div class="flex items-center gap-2">
                <span id="gregorian-date">Friday, March 17</span>
                <span class="text-gray-500">|</span>
                <span id="hijri-date">15 Ramadan 1446</span>
            </div>
            <button id="fetch-button" onclick="getPrayerTimes()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1 rounded flex items-center gap-2 transition text-sm">
                🔄 <span>Reload Today's</span>
            </button>
        </div>

        <!-- Next Prayer Box -->
        <div id="next-prayer-box" class="bg-gray-700 text-white rounded-lg px-4 py-2 mb-4 shadow flex justify-between items-center hidden">
            <div>
                <div class="text-sm text-gray-300">Next Prayer</div>
                <strong id="next-prayer-label" class="text-lg"></strong>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loading-spinner" class="hidden mt-4 text-center">
            <svg class="animate-spin h-8 w-8 text-white mx-auto" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
            </svg>
            <p id="loading-message" class="text-gray-300 mt-2">Fetching today's prayer times...</p>
        </div>

        <!-- Prayer Times Output -->
        <div id="output" class="mt-4"></div>

        <!-- Time Calculation Method Footer -->
        <div id="calculation-method" class="mt-6 text-sm text-gray-400 text-center"></div>

        <!-- Show/Hide Extra Prayers Toggle -->
        <div class="border-t border-gray-700 mt-4 pt-3 text-center text-sm text-gray-300 cursor-pointer hover:text-white" onclick="toggleExtras()" id="toggle-extras">
            Show Extra Prayers →
        </div>
    </div>
</body>
</html>
